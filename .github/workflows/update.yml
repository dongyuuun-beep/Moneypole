name: MoneyPole Daily Rate Update
on:
  schedule:
    # 02:17 Asia/Seoul. GitHub schedules can be delayed.
    - cron: '17 17 * * *'
  workflow_dispatch:
    inputs:
      accept_large_changes:
        description: '공식 출처 확인 후 3%p 초과 변동 승인'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify collectors and preservation rules
        run: python -m unittest discover -s tests -v
      - name: Collect official rates
        id: collect
        continue-on-error: true
        env:
          FSS_API_KEY: ${{ secrets.FSS_API_KEY }}
          ACCEPT_LARGE_CHANGES: ${{ inputs.accept_large_changes }}
        run: |
          args=()
          if [ "$ACCEPT_LARGE_CHANGES" = 'true' ]; then args+=(--accept-large-changes); fi
          python update_rates.py "${args[@]}"
      - name: Keep collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rate-update-report
          path: update_status.json
      - name: Publish successful sources and failure status
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data.json update_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update official rates and collection status"
          git push
      - name: Report incomplete collection
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Some sources failed. Previous values were preserved. See the job summary.'
          exit 1
